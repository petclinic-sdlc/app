name: Discovery Server CI

on:
  push:
    branches:
      - feature/docker-discovery-server
    paths:
      - "spring-petclinic-discovery-server/**"
      - ".github/workflows/discovery-server-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "spring-petclinic-discovery-server/**"

jobs:
  config-service-ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build & Test (ROOT level)
      - name: Build and Test Project
        run: ./mvnw clean test

      # Build only config-server JAR
      - name: Build JAR Artifact
        run: ./mvnw clean package -DskipTests -pl spring-petclinic-discovery-server -am

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
          -t petclinic-discovery-server:${{ github.sha }} \
          -f spring-petclinic-discovery-server/Dockerfile \
            .
      # Trivy scan
      # - name: Run Trivy Security Scan
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: "petclinic-customers-service:${{ github.sha }}"
      #     format: "table"
      #     exit-code: "1"
      #     ignore-unfixed: true
      #     vuln-type: "os,library"
      #     severity: "CRITICAL,HIGH"

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag + Push
      - name: Push Docker Image
        run: |
          docker tag petclinic-discovery-server:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-discovery-server:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-discovery-server:${{ github.sha }}
