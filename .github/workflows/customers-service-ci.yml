name: Customers Service CI

on:
  push:
    branches:
      - feature/docker-customers-service
    paths:
      - "spring-petclinic-customers-service/**"
      - ".github/workflows/customers-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "spring-petclinic-customers-service/**"

jobs:
  customers-service-ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Make mvnw executable
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Run tests
      - name: Run Unit and Integration Tests
        run: ./mvnw test -f pom.xml

      # Build JAR
      - name: Build JAR Artifact
        run: ./mvnw clean package -DskipTests -f pom.xml

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t petclinic-customers-service:${{ github.sha }} spring-petclinic-customers-service

      # Trivy scan
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "petclinic-customers-service:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and push image
      - name: Push Docker Image
        run: |
          docker tag petclinic-customers-service:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-customers-service:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-customers-service:${{ github.sha }}
